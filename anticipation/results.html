<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read the Swing — Results</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .results { max-width: 760px; align-items: stretch; }
    .results h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: normal; text-align: center; margin-bottom: 0.5rem; }
    .results .lede { text-align: center; color: var(--muted); font-style: italic; line-height: 1.6; margin-bottom: 2rem; }
    .hero { text-align: center; margin-bottom: 2.5rem; }
    .hero .big { font-size: 3.2rem; color: var(--accent); line-height: 1.1; }
    .hero .sub { color: var(--muted); font-size: 0.9rem; margin-top: 0.4rem; line-height: 1.6; }
    .hero .verdict { margin-top: 0.8rem; font-size: 1rem; }
    .hero .progress-note { margin-top: 0.4rem; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.04em; }
    ol.hyp { padding-left: 1.3rem; line-height: 1.6; font-size: 0.9rem; }
    ol.hyp li { margin-bottom: 0.35rem; }
    ol.hyp b { font-weight: normal; color: var(--accent); }
    h2.section { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
                 font-weight: normal; margin: 2rem 0 0.75rem; border-bottom: 1px solid var(--surface); padding-bottom: 0.4rem; }
    .note { color: var(--muted); font-size: 0.8rem; line-height: 1.6; margin-top: 0.6rem; }
    .chart-wrap { position: relative; }
    #lead-chart { width: 100%; height: auto; display: block; overflow: visible; }
    #lead-chart .grid  { stroke: var(--surface); stroke-width: 1; }
    #lead-chart .axis  { fill: var(--muted); font-size: 11px; font-family: Georgia, serif; }
    #lead-chart .chance { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
    #lead-chart .chance-label { fill: var(--muted); font-size: 11px; font-style: italic; font-family: Georgia, serif; }
    #lead-chart .scout { fill: none; stroke: var(--muted); stroke-width: 2; }
    .legend { display: flex; gap: 1.25rem; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; }
    .legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
    .legend .lg-dot { fill: var(--accent); }
    .legend .lg-scout { fill: none; stroke: var(--muted); stroke-width: 2; }
    #lead-chart .ci   { stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
    #lead-chart .dot  { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
    #lead-chart .val  { fill: var(--cream); font-size: 12px; font-family: Georgia, serif; }
    #lead-chart .hit  { fill: transparent; cursor: default; }
    #lead-chart .cat  { fill: var(--cream); font-size: 12px; font-family: Georgia, serif; text-anchor: middle; }
    .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--green);
           padding: 0.5rem 0.7rem; font-size: 0.8rem; line-height: 1.5; border-radius: 2px; white-space: nowrap;
           transform: translate(-50%, -110%); }
    table.stats { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    table.stats th { text-align: right; color: var(--muted); font-weight: normal; font-size: 0.72rem;
                     letter-spacing: 0.06em; text-transform: uppercase; padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--green); }
    table.stats th:first-child, table.stats td:first-child { text-align: left; }
    table.stats td { text-align: right; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--surface);
                     font-variant-numeric: tabular-nums; }
    .sig { color: var(--correct); }
    .empty { text-align: center; color: var(--muted); padding: 3rem 0; line-height: 1.8; }
    .actions { text-align: center; margin-top: 2.5rem; }
    .actions a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="screen results">
    <a href="./" class="back-link">← Read the Swing</a>
    <h1>Can you read the swing?</h1>
    <p class="lede">Every session shows equal numbers of pull, center and oppo, so blind guessing scores exactly 33%.
      Anything reliably above that means people are anticipating the ball.</p>

    <div id="content"><p class="empty">Loading results…</p></div>

    <div class="actions"><a href="./">Play a round →</a></div>
  </div>

  <script src="stats.js"></script>
  <script>
  (() => {
    const EXP = { none: 'Never / casual', youth: 'Youth or high school', college: 'College, pro or coaching' };
    const FRAME = 1 / 60;
    const PLANNED_SESSIONS = 60;   // fixed in advance — see scripts/analyze.py
    const pct = x => `${(x * 100).toFixed(1)}%`;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    Promise.all([
      fetch('/api/trials').then(r => r.ok ? r.json() : Promise.reject()),
      fetch('data.json').then(r => r.json()),
      fetch('baselines.json').then(r => r.ok ? r.json() : null).catch(() => null),
    ]).then(([rows, plays, base]) => render(rows, plays, base)).catch(() => {
      document.getElementById('content').innerHTML =
        '<p class="empty">Results are collected by the local server.<br>Run <code>python scripts/server.py</code> and reload.</p>';
    });

    function summarize(list) {
      const n = list.length, k = list.filter(r => r.correct).length;
      return { n, k, acc: n ? k / n : 0, ci: Stats.wilson(k, n), p: Stats.binomTail(k, n) };
    }

    function render(rows, plays, base) {
      // Same quality gates as scripts/analyze.py: the frame shown is never late and at most
      // 3 frames early; first views only
      const early = r => (r.contact_time - r.lead_s) - r.frozen_at;
      const perSession = rows.reduce((m, r) => (m[r.session_id] = (m[r.session_id] || 0) + 1, m), {});
      const keep = rows.filter(r => perSession[r.session_id] >= 18 && (r.rt_ms ?? 0) >= 250 &&
        early(r) >= -0.5 * FRAME && early(r) <= 3 * FRAME && !r.repeat);
      const el = document.getElementById('content');
      if (!keep.length) {
        el.innerHTML = '<p class="empty">No results yet. Be the first — play a round.</p>';
        return;
      }
      const all = summarize(keep);
      const players = new Set(keep.map(r => r.player_id)).size;
      const sessions = Object.values(perSession).filter(n => n >= 18).length;
      const interim = sessions < PLANNED_SESSIONS;
      const verdict = all.p < 0.05
        ? `Above chance in a simple pooled test (${Stats.fmtP(all.p)}).${interim ? ' Interim — the study isn’t finished.' : ''}`
        : `Not yet distinguishable from chance (pooled test, ${Stats.fmtP(all.p)}).`;

      // The scouting report: best strategy that never watches the clip
      let best = null, scout = null;
      if (base) {
        best = base.strategies.reduce((a, b) => (b.acc > a.acc ? b : a));
        scout = Object.fromEntries(base.per_clip.map(c => [c.play_id, c[`${best.key}/${best.rule}`]]));
      }
      const scored = scout ? keep.filter(r => scout[r.play_id]) : [];
      const reportRight = scored.filter(r => scout[r.play_id] === r.direction);
      const reportWrong = scored.filter(r => scout[r.play_id] !== r.direction);
      const groups = [
        { label: 'All clips', note: 'every first-look trial', ...summarize(keep),
          scout: scored.length ? reportRight.length / scored.length : null },
        ...(scout ? [
          { label: 'Report right', note: 'clips the scouting report calls correctly', ...summarize(reportRight), scout: 1 },
          { label: 'Report wrong', note: 'clips where hitter tendencies + pitch location point the wrong way', ...summarize(reportWrong), scout: 0 },
        ] : []),
      ];
      const byExp = Object.entries(EXP).map(([k, label]) => ({ label, ...summarize(keep.filter(r => r.experience === k)) }));

      const clipMap = Object.fromEntries(plays.map(p => [p.play_id, p]));
      const byClip = Object.values(keep.reduce((m, r) => ((m[r.play_id] ||= []).push(r), m), {}))
        .map(list => ({ play: clipMap[list[0].play_id] || {}, ...summarize(list) }))
        .filter(c => c.n >= 5)
        .sort((a, b) => a.p - b.p)
        .slice(0, 12);

      el.innerHTML = `
        <div class="hero">
          <div class="big">${pct(all.acc)}</div>
          <div class="sub">correct across ${all.n} first-look trials from ${players} player${players === 1 ? '' : 's'}<br>
            95% interval ${pct(all.ci[0])} – ${pct(all.ci[1])} · chance is 33.3%</div>
          <div class="verdict">${verdict}</div>
          <div class="progress-note">${sessions} of ${PLANNED_SESSIONS} planned complete sessions</div>
        </div>

        <h2 class="section">What we’re testing</h2>
        <p class="note" style="margin-top:0">Every clip freezes two frames (1/30 of a second) before the bat meets the ball.</p>
        <ol class="hyp">
          <li><b>People beat chance.</b> Accuracy above 33%.</li>
          <li><b>It’s the swing, not the scouting report.</b> On clips where the hitter’s tendencies and the pitch location
            point the wrong way, people still beat 33%. Someone going on those alone would score <i>below</i> 33% there,
            so this is the clearest sign they’re reading the swing.</li>
        </ol>
        <p class="note">Fixed before collecting data, along with the sample size, so the result can’t be cherry-picked.
          The official verdict comes from <code>scripts/analyze.py</code>, which uses a mixed model across players and
          clips, so one heavy player or a few easy clips can’t carry it. Numbers on this page are simpler summaries.</p>

        <h2 class="section">People vs the scouting report</h2>
        <div class="legend">
          <span><svg width="14" height="14"><circle cx="7" cy="7" r="5" class="lg-dot"/></svg> People (95% interval)</span>
          <span><svg width="14" height="14"><circle cx="7" cy="7" r="5" class="lg-scout"/></svg> Scouting report, same clips</span>
        </div>
        <div class="chart-wrap"><svg id="lead-chart" viewBox="0 0 640 280" role="img"
          aria-label="Accuracy for all clips and split by whether the scouting report is right; see table below"></svg>
          <div class="tip hidden" id="tip"></div></div>
        <p class="note">The scouting report knows each hitter’s 2024 tendencies and the pitch location but never sees the
          swing. Where it’s wrong it scores zero by definition, so the right-hand dot clearing the dashed 33% line is the
          clearest evidence of reading the swing.</p>
        ${table(['Clips', 'Correct', 'Accuracy', '95% interval', 'vs chance'],
          groups.map(r => [r.label, `${r.k}/${r.n}`, r.n ? pct(r.acc) : '—', r.n ? `${pct(r.ci[0])}–${pct(r.ci[1])}` : '—', pcell(r)]))}

        ${base ? `<h2 class="section">Scoring without watching</h2>
        ${table(['Strategy', 'Correct', 'Accuracy'],
          base.strategies.map(st => [st.label, `${st.k}/${st.n}`, pct(st.acc)]))}
        <p class="note">How well someone would do on these ${base.n_clips} clips using only what’s known before the pitch:
          each hitter’s 2024 spray tendencies on similar batted balls, the pitch location, or both. Inside pitches get
          pulled and hitters have habits, so a lot is predictable before the swing. Each strategy is scored on just
          ${base.n_clips} clips, so treat these as ±${Math.round(98 / Math.sqrt(base.n_clips))} points.</p>` : ''}

        <h2 class="section">By playing experience</h2>
        ${table(['Experience', 'Correct', 'Accuracy', '95% interval', 'vs chance'],
          byExp.map(r => [r.label, `${r.k}/${r.n}`, r.n ? pct(r.acc) : '—', r.n ? `${pct(r.ci[0])}–${pct(r.ci[1])}` : '—', pcell(r)]))}

        <h2 class="section">Most readable pitches</h2>
        ${byClip.length ? table(['Batter', 'Went', 'Correct', 'Accuracy', 'vs chance'],
          byClip.map(c => [esc(c.play.batter || '?'), c.play.direction || '', `${c.k}/${c.n}`, pct(c.acc), pcell(c)]))
          : '<p class="note">Clips appear here once they have at least 5 first-look trials.</p>'}
        <p class="note">Per-clip p-values aren’t corrected for testing many clips; <code>scripts/analyze.py</code> applies
          Benjamini–Hochberg. Only complete 18-clip rounds count. Trials are also excluded if the frame shown was at all late (it
          could show contact) or more than 3 frames early, if the answer came under 0.25 s after the freeze, or
          if the player had seen the clip before.</p>
      `;
      drawChart(groups);
    }

    function pcell(r) {
      if (!r.n) return '—';
      return r.p < 0.05 ? `<span class="sig">${Stats.fmtP(r.p)}</span>` : Stats.fmtP(r.p);
    }

    function table(head, rows) {
      return `<table class="stats"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }

    function drawChart(data) {
      const svg = document.getElementById('lead-chart');
      const W = 640, H = 280, m = { l: 44, r: 20, t: 16, b: 44 };
      const y = v => m.t + (1 - v) * (H - m.t - m.b);
      const x = i => m.l + (i + 0.5) * (W - m.l - m.r) / data.length;
      const ticks = [0, 0.25, 0.5, 0.75, 1];
      let s = ticks.map(t => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/>
        <text class="axis" x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${t * 100}%</text>`).join('');
      s += `<line class="chance" x1="${m.l}" x2="${W - m.r}" y1="${y(1 / 3)}" y2="${y(1 / 3)}"/>
        <text class="chance-label" x="${W - m.r}" y="${y(1 / 3) + 14}" text-anchor="end">chance 33%</text>`;
      data.forEach((d, i) => {
        s += `<text class="cat" x="${x(i)}" y="${H - m.b + 20}">${d.label}</text>`;
        if (d.scout != null) s += `<circle class="scout" cx="${x(i) - 22}" cy="${y(d.scout)}" r="6"/>`;
        if (!d.n) return;
        s += `<line class="ci" x1="${x(i)}" x2="${x(i)}" y1="${y(d.ci[0])}" y2="${y(d.ci[1])}"/>
          <circle class="dot" cx="${x(i)}" cy="${y(d.acc)}" r="6"/>
          <text class="val" x="${x(i) + 12}" y="${y(d.acc) + 4}">${pct(d.acc)}</text>
          <rect class="hit" data-i="${i}" x="${x(i) - 50}" y="${m.t}" width="100" height="${H - m.t - m.b}"/>`;
      });
      svg.innerHTML = s;

      const tip = document.getElementById('tip');
      svg.querySelectorAll('.hit').forEach(r => {
        r.addEventListener('mouseenter', () => {
          const d = data[+r.dataset.i];
          tip.innerHTML = `<b>${d.label}</b> — ${d.note}<br>People: ${d.k}/${d.n} correct · ${pct(d.acc)}
            (95% ${pct(d.ci[0])}–${pct(d.ci[1])})${d.scout != null ? `<br>Scouting report: ${pct(d.scout)}` : ''}`;
          const box = svg.getBoundingClientRect(), scale = box.width / W;
          tip.style.left = `${x(+r.dataset.i) * scale}px`;
          tip.style.top = `${y(Math.max(d.ci[1], d.scout ?? 0)) * scale}px`;
          tip.classList.remove('hidden');
        });
        r.addEventListener('mouseleave', () => tip.classList.add('hidden'));
      });
    }
  })();
  </script>
</body>
</html>
