<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clip Review — Eephus Maximus</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0f1a0f;
      --surface: #162116;
      --green:   #2d5a27;
      --cream:   #f5f0e8;
      --muted:   #8a9e85;
      --accent:  #c8a84b;
      --ok:      #4caf50;
      --bad:     #e53935;
      --todo:    #c8a84b;
    }
    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Georgia', serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    kbd {
      background: var(--surface);
      border: 1px solid var(--green);
      border-radius: 2px;
      padding: 0 4px;
      font-family: monospace;
      font-size: 0.75rem;
    }

    /* ── sidebar ── */
    #sidebar {
      width: 240px;
      min-width: 240px;
      border-right: 1px solid var(--green);
      overflow-y: auto;
    }
    #sidebar h2 {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.75rem 1rem;
      position: sticky;
      top: 0;
      background: var(--bg);
    }
    .clip-item {
      padding: 0.45rem 1rem;
      cursor: pointer;
      border-left: 3px solid transparent;
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .clip-item:hover { background: var(--surface); }
    .clip-item.active { background: var(--surface); border-left-color: var(--accent); }
    .clip-item .meta { color: var(--muted); font-size: 0.72rem; }
    .status { font-size: 0.7rem; font-family: monospace; }
    .status.todo { color: var(--todo); }
    .status.ok   { color: var(--ok); }
    .status.bad  { color: var(--bad); }

    /* ── main ── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #top-bar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0.6rem 1.25rem;
      border-bottom: 1px solid var(--green);
      gap: 1rem;
    }
    #clip-title { font-size: 1rem; }
    #clip-title .sub { font-size: 0.8rem; color: var(--muted); font-style: italic; margin-left: 0.5rem; }
    #progress-count { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }

    #video-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    #v { max-width: 100%; max-height: 100%; outline: none; }

    #bottom-bar {
      border-top: 1px solid var(--green);
      padding: 0.75rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem 1rem;
    }
    #time-display { font-family: monospace; font-size: 1.6rem; color: var(--accent); min-width: 9ch; }
    #time-display small { font-size: 0.8rem; color: var(--muted); display: block; }
    .group { display: flex; gap: 4px; align-items: center; }
    .group-label { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-right: 4px; }

    .btn {
      background: var(--surface);
      color: var(--cream);
      border: 1px solid var(--green);
      padding: 0.45rem 0.8rem;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 2px;
      white-space: nowrap;
    }
    .btn:hover { background: var(--green); }
    .btn.primary { background: var(--green); border-color: var(--ok); }
    .btn.primary:hover { background: var(--ok); color: #fff; }
    .btn.danger:hover { background: var(--bad); border-color: var(--bad); }

    #status { font-size: 0.8rem; color: var(--ok); min-width: 10ch; transition: opacity 0.3s; }
    #status.fade { opacity: 0; }
    #help { width: 100%; font-size: 0.72rem; color: var(--muted); line-height: 1.8; }
  </style>
</head>
<body>

<div id="sidebar">
  <h2>Clips <span id="done-count"></span></h2>
  <div id="clip-list"></div>
</div>

<div id="main">
  <div id="top-bar">
    <div id="clip-title">Loading…</div>
    <div id="progress-count"></div>
  </div>

  <div id="video-area">
    <video id="v" controls muted></video>
  </div>

  <div id="bottom-bar">
    <div id="time-display">0.000<small>contact —</small></div>

    <div class="group">
      <span class="group-label">Jump</span>
      <button class="btn" data-jump="release">Release</button>
      <button class="btn" data-jump="flight">Flight</button>
      <button class="btn" data-jump="swing">Swing</button>
      <button class="btn" data-jump="contact">Contact</button>
    </div>

    <div class="group">
      <button class="btn" id="frame-back">« Frame</button>
      <button class="btn" id="frame-fwd">Frame »</button>
    </div>

    <div class="group">
      <button class="btn" id="set-btn">Set contact here</button>
      <button class="btn primary" id="verify-btn">Verify ✓</button>
      <button class="btn danger" id="exclude-btn">Exclude</button>
    </div>

    <div class="group">
      <button class="btn" id="prev-btn">← Prev</button>
      <button class="btn" id="next-btn">Next →</button>
    </div>

    <div id="status"></div>

    <div id="help">
      Contact must be the first frame where the bat meets the ball. Check that the <b>swing</b> freeze shows no contact
      and that the camera is the center-field view. &nbsp;
      <kbd>,</kbd>/<kbd>.</kbd> frame · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> jump release/flight/swing/contact ·
      <kbd>S</kbd> set contact · <kbd>V</kbd> verify · <kbd>X</kbd> exclude · <kbd>[</kbd>/<kbd>]</kbd> clip
    </div>
  </div>
</div>

<script>
(() => {
  // Keep in sync with LEADS in app.js / scripts/process_clips.py
  const LEADS = { release: 24 / 60, flight: 12 / 60, swing: 4 / 60 };
  const FRAME = 1 / 60;

  let plays = [];
  let order = [];      // play indexes, unreviewed first
  let current = 0;     // index into plays
  const v = document.getElementById('v');
  const $ = id => document.getElementById(id);

  fetch('data.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      plays = data;
      const rank = p => p.exclude ? 2 : p.contact_verified ? 1 : 0;
      order = plays.map((p, i) => i).filter(i => plays[i].clip_file)
        .sort((a, b) => rank(plays[a]) - rank(plays[b]));
      buildSidebar();
      if (order.length) loadClip(order[0]);
    });

  // ── sidebar ───────────────────────────────────────────────────────────────
  function status(p) {
    if (p.exclude) return ['bad', 'excluded'];
    if (p.contact_verified) return ['ok', `verified · ${p.contact_time.toFixed(3)}s`];
    return ['todo', `needs review · ${p.contact_time?.toFixed(3) ?? '—'}s`];
  }

  function buildSidebar() {
    $('clip-list').innerHTML = order.map(i => {
      const p = plays[i];
      const [cls, text] = status(p);
      return `<div class="clip-item" id="item-${i}" data-i="${i}">
        <div>${p.batter} <span class="meta">(${p.stand})</span></div>
        <div class="meta">${p.direction} · ${p.spray_angle}° · ${p.launch_speed} mph</div>
        <div class="status ${cls}" id="status-${i}">${text}</div>
      </div>`;
    }).join('');
    $('clip-list').querySelectorAll('.clip-item').forEach(el =>
      el.addEventListener('click', () => loadClip(+el.dataset.i)));
    updateCounts();
  }

  function updateItem(i) {
    const [cls, text] = status(plays[i]);
    const el = $(`status-${i}`);
    el.className = `status ${cls}`;
    el.textContent = text;
    updateCounts();
  }

  function updateCounts() {
    const live = order.map(i => plays[i]);
    const done = live.filter(p => p.contact_verified || p.exclude).length;
    $('done-count').textContent = `${done}/${live.length}`;
    const byDir = ['pull', 'center', 'oppo'].map(d =>
      `${live.filter(p => p.direction === d && p.contact_verified && !p.exclude).length} ${d}`).join(' · ');
    $('progress-count').textContent = `${live.length - done} to review · playable: ${byDir}`;
  }

  // ── clip ──────────────────────────────────────────────────────────────────
  function loadClip(i) {
    current = i;
    document.querySelectorAll('.clip-item').forEach(el => el.classList.remove('active'));
    const item = $(`item-${i}`);
    item.classList.add('active');
    item.scrollIntoView({ block: 'nearest' });

    const p = plays[i];
    $('clip-title').innerHTML = `${p.batter} (${p.stand})` +
      `<span class="sub">${p.direction} · ${p.spray_angle}° · ${(p.events || '').replace(/_/g, ' ')}` +
      ` · vs ${p.pitcher} · ${p.game_date}</span>`;
    v.src = p.clip_file;
    v.addEventListener('loadeddata', () => jump('swing'), { once: true });
  }

  function jump(what) {
    const c = plays[current].contact_time;
    if (c == null) return;
    v.pause();
    v.currentTime = what === 'contact' ? c : c - LEADS[what];
  }

  function step(dir) {
    v.pause();
    v.currentTime = Math.max(0, v.currentTime + dir * FRAME);
  }

  const showTime = () => {
    const c = plays[current]?.contact_time;
    $('time-display').innerHTML = `${v.currentTime.toFixed(3)}` +
      `<small>${c != null ? `contact ${(v.currentTime - c >= 0 ? '+' : '')}${(v.currentTime - c).toFixed(3)}s` : 'contact —'}</small>`;
  };
  v.addEventListener('timeupdate', showTime);
  v.addEventListener('seeked', showTime);

  // ── save ──────────────────────────────────────────────────────────────────
  async function save(fields) {
    const res = await fetch('/api/save-fields', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ updates: [{ index: current, fields }] }),
    });
    if (!res.ok) return flash('save failed — is scripts/server.py running?', true);
    for (const [k, val] of Object.entries(fields)) {
      if (val === null) delete plays[current][k]; else plays[current][k] = val;
    }
    updateItem(current);
  }

  function flash(msg, bad) {
    const s = $('status');
    s.textContent = msg;
    s.style.color = bad ? 'var(--bad)' : '';
    s.classList.remove('fade');
    clearTimeout(s._t);
    s._t = setTimeout(() => s.classList.add('fade'), 2000);
  }

  async function setContact() {
    // Snap to the frame grid so contact lines up with what the game shows
    const t = Math.round(v.currentTime * 60) / 60;
    const p = plays[current];
    const shift = t - p.contact_time;
    // contact_raw lets process_clips.py re-encode around the corrected time
    await save({ contact_time: +t.toFixed(3), contact_raw: +((p.contact_raw ?? 0) + shift).toFixed(3) });
    flash(`contact set to ${t.toFixed(3)}s (${shift >= 0 ? '+' : ''}${(shift * 1000).toFixed(0)}ms)`);
  }

  async function verify() {
    await save({ contact_verified: true, exclude: null, exclude_reason: null });
    flash('✓ verified');
    nextUnreviewed();
  }

  async function toggleExclude() {
    const p = plays[current];
    if (p.exclude) {
      await save({ exclude: null, exclude_reason: null });
      return flash('restored');
    }
    const why = prompt('Why exclude this clip?', 'not the center-field camera');
    if (why === null) return;
    await save({ exclude: true, exclude_reason: why || 'excluded in review' });
    flash('excluded');
    nextUnreviewed();
  }

  function nextUnreviewed() {
    const pos = order.indexOf(current);
    const nxt = order.slice(pos + 1).concat(order.slice(0, pos))
      .find(i => !plays[i].contact_verified && !plays[i].exclude);
    if (nxt != null) loadClip(nxt);
  }

  function move(d) {
    const pos = order.indexOf(current) + d;
    if (pos >= 0 && pos < order.length) loadClip(order[pos]);
  }

  // ── wiring ────────────────────────────────────────────────────────────────
  document.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => jump(b.dataset.jump)));
  $('frame-back').addEventListener('click', () => step(-1));
  $('frame-fwd').addEventListener('click', () => step(+1));
  $('set-btn').addEventListener('click', setContact);
  $('verify-btn').addEventListener('click', verify);
  $('exclude-btn').addEventListener('click', toggleExclude);
  $('prev-btn').addEventListener('click', () => move(-1));
  $('next-btn').addEventListener('click', () => move(+1));

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const jumps = { '1': 'release', '2': 'flight', '3': 'swing', '4': 'contact' };
    if (jumps[k]) jump(jumps[k]);
    else if (k === ',') step(-1);
    else if (k === '.') step(+1);
    else if (k === 's') setContact();
    else if (k === 'v') verify();
    else if (k === 'x') toggleExclude();
    else if (k === '[') move(-1);
    else if (k === ']') move(+1);
    else return;
    e.preventDefault();
  });
})();
</script>
</body>
</html>
